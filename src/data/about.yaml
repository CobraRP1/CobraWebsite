# About page + homepage "What We Do" teaser.
# Content supplied by the center (Sept 2026). `intro` feeds the homepage teaser;
# `hero` + `sections` drive /about/. Section ids match the About dropdown in site.yaml.

# Homepage "What We Do" teaser (first What-we-do paragraph).
intro: >-
  COBRA – the Mannheim Center for Corporate Behavior and Regulation Analysis – is based
  at Mannheim Business School and supports research on regulation, taxation, financial
  markets, corporate decision-making, and public policy.

hero:
  title: How Policy Shapes Business – and Why it Matters
  intro: >-
    We study the real-world effects of regulation and public policy on businesses,
    markets, and society.

sections:
  - id: what-we-do
    title: What we do
    paragraphs:
      - >-
        COBRA – the Mannheim Center for Corporate Behavior and Regulation Analysis – is
        based at Mannheim Business School and supports research on regulation, taxation,
        financial markets, corporate decision-making, and public policy.
      - >-
        The Center provides the infrastructure and programs that support collaborative,
        data-driven research and academic development.
    listLabel: "Its core activities include:"
    bullets:
      - Pre-doctoral research assistant program preparing outstanding candidates for leading PhD placements
      - Research funding for faculty and students
      - Academic seminars and visiting scholar programs
      - Conferences, workshops, and events
      - Dissemination of research through policy engagement, public outreach, and media communication

  - id: who-we-serve
    title: Who we serve
    paragraphs:
      - >-
        COBRA works with researchers, students, policymakers, businesses, and media
        organizations to connect academic research with real-world economic and
        regulatory questions.
    cards:
      - term: Academics
        description: An international platform for collaborative research and interdisciplinary exchange.
      - term: Students & Early-Career Researchers
        description: Research teaching, mentoring, and hands-on experience that support doctoral placements and academic careers.
      - term: Policymakers
        description: Independent empirical evidence that informs regulatory debates and policy design.
      - term: Businesses
        description: Access to academic expertise, research insights, and emerging analytical talent.
      - term: Journalists
        description: Evidence-based analysis that supports informed reporting and public discussion.

  - id: our-impact
    title: Our impact
    paragraphs:
      - >-
        COBRA strengthens the connection between academic research, public policy, and
        business practice through rigorous empirical analysis, researcher development,
        and policy engagement.
    cards:
      - term: Advancing Research Excellence
        description: Supporting internationally recognized research on regulation, taxation, transparency, and corporate behavior.
      - term: Developing Academic Talent
        description: Preparing early-career researchers for leading doctoral programs and research careers through structured mentoring and academic training.
      - term: Shaping Policy & Practice
        description: Contributing empirical evidence to policy discussions, regulatory debates, and public discourse.
      - term: Informing Business & Society
        description: Providing evidence-based insights that support informed discussion across business, regulation, and media audiences.
